<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24243e"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="fw1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity=".8"/>
    </linearGradient>
    <clipPath id="fbox">
      <rect x="0" y="0" width="1000" height="150" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fbox)">
    <rect width="1000" height="150" fill="url(#fbg)"/>

    <g transform="translate(0,-8)">
      <path fill="url(#fw1)" d="M-1000 40 Q -875 68 -750 40 T -500 40 T -250 40 T 0 40 T 250 40 T 500 40 T 750 40 T 1000 40 T 1250 40 T 1500 40 T 1750 40 T 2000 40 V -20 H -1000 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="500" y="104" text-anchor="middle"
      font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#00ff9f"
      letter-spacing="3" opacity=".95">❯ exit 0 — thanks for scrolling</text>

    <text x="500" y="128" text-anchor="middle"
      font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#c9d1d9"
      letter-spacing="2" opacity=".6">github.com/Qorvhex</text>
  </g>
</svg>
