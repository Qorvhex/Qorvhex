<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Qorvhex">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9f" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity=".45"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="box">
      <rect x="0" y="0" width="1000" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#box)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <g opacity=".28" fill="none" stroke="#00ff9f" stroke-width=".6">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000"/>
      <path d="M100 0V220M200 0V220M300 0V220M400 0V220M500 0V220M600 0V220M700 0V220M800 0V220M900 0V220"/>
    </g>

    <text x="500" y="104" text-anchor="middle" filter="url(#glow)"
      font-family="'JetBrains Mono','Courier New',monospace" font-size="64" font-weight="800"
      fill="#00ff9f" letter-spacing="10">QORVHEX</text>

    <text x="500" y="140" text-anchor="middle"
      font-family="'JetBrains Mono','Courier New',monospace" font-size="17" font-weight="500"
      fill="#c9d1d9" letter-spacing="5" opacity=".9">build • obfuscate • deploy</text>

    <g transform="translate(0,150)">
      <path fill="url(#wave2)" d="M-1000 30 Q -875 4 -750 30 T -500 30 T -250 30 T 0 30 T 250 30 T 500 30 T 750 30 T 1000 30 T 1250 30 T 1500 30 T 1750 30 T 2000 30 V 90 H -1000 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave1)" d="M-1000 46 Q -875 22 -750 46 T -500 46 T -250 46 T 0 46 T 250 46 T 500 46 T 750 46 T 1000 46 T 1250 46 T 1500 46 T 1750 46 T 2000 46 V 90 H -1000 Z">
        <animateTransform attributeName="transform" type="translate" values="500 0; 0 0" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
